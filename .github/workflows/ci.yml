name: CI

on:
  push:
    branches: [main]
  # Every other branch is covered on its pull request, so work in progress is
  # tested without naming each branch here.
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Grading logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Only the game-independent projects are built here.
      #
      # The mod assembly references sts2.dll, 0Harmony.dll and GodotSharp.dll
      # from a local Slay the Spire 2 install. Those are proprietary and are
      # neither committed nor redistributable, so CI cannot compile the mod.
      # Everything worth unit-testing therefore lives in Ossuary.Grading, which
      # deliberately references nothing from the game — see docs/COMPAT.md.
      - name: Restore
        run: dotnet restore tests/Ossuary.Grading.Tests/Ossuary.Grading.Tests.csproj

      - name: Build
        run: dotnet build tests/Ossuary.Grading.Tests/Ossuary.Grading.Tests.csproj -c Release --no-restore

      # Windows PowerShell 5.1 reads .ps1 as ANSI without a UTF-8 BOM, so a
      # non-ASCII character in a string is a parse error, not a display glitch.
      # tools/logs.ps1 was broken this way for several milestones because the
      # scripts are never exercised in CI.
      - name: PowerShell scripts must parse on Windows
        run: python3 tools/check-encoding.py

      - name: Test
        run: dotnet test tests/Ossuary.Grading.Tests/Ossuary.Grading.Tests.csproj -c Release --no-build --verbosity normal
