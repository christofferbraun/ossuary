name: Refresh Codex data

# Checks whether Spire Codex has published a newer snapshot and, if so, opens a
# pull request with the refetched and regraded rating table.
#
# A pull request rather than a direct commit, deliberately: a refresh can move a
# hundred entries between grades, and that should be something a human glances at
# before it ships. The PR body carries the tier changes so the review does not
# mean reading a 39 KB diff.

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Codex rebuilds far more often than Ossuary
    # ships, so anything more frequent is churn.
    #
    # Scheduled workflows only run from the default branch, and GitHub disables
    # them after 60 days without repository activity.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch even if the snapshot version has not moved'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refetch and regrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check the published snapshot
        id: check
        run: |
          set +e
          output=$(dotnet run --project tools/FetchCodexData/FetchCodexData.csproj -c Release -- --check)
          code=$?
          set -e
          echo "$output"
          # --check exits 10 when the published snapshot is ahead of the
          # committed one, 0 when they match, and anything else is a real error.
          if [ "$code" -eq 10 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "fetch-codex-data --check failed with $code"
            exit "$code"
          fi

      - name: Refetch and regrade
        if: steps.check.outputs.stale == 'true' || inputs.force
        id: fetch
        run: |
          {
            echo 'summary<<OSSUARY_EOF'
            dotnet run --project tools/FetchCodexData/FetchCodexData.csproj -c Release
            echo 'OSSUARY_EOF'
          } >> "$GITHUB_OUTPUT"

      # Non-blocking on purpose.
      #
      # These tests assert things about the regenerated table, and a failure is
      # worth seeing — but not worth throwing the refresh away over. If this step
      # gated the pull request, a game patch that added cards would fail the job,
      # create nothing, and discard the fetched table on the runner, leaving a red
      # scheduled run nobody is watching. Instead the result is reported in the PR
      # body and a failing refresh opens as a draft.
      #
      # It has to run here rather than on the pull request: GitHub does not
      # trigger workflows for events raised by GITHUB_TOKEN, so a PR opened by
      # this job never fires ci.yml.
      - name: Verify the regraded table
        if: steps.check.outputs.stale == 'true' || inputs.force
        id: verify
        continue-on-error: true
        run: dotnet test tests/Ossuary.Grading.Tests/Ossuary.Grading.Tests.csproj -c Release --verbosity normal

      - name: Open a pull request
        id: pr
        if: steps.check.outputs.stale == 'true' || inputs.force
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/codex-refresh
          draft: ${{ steps.verify.outcome == 'failure' }}
          title: >-
            ${{ steps.verify.outcome == 'failure'
                && 'Refresh Codex ratings (checks failing)'
                || 'Refresh Codex ratings' }}
          commit-message: |
            Refresh Codex ratings

            Regenerated by tools/FetchCodexData from a newer Spire Codex
            snapshot. Tiers are re-derived over the whole population, so an
            entry can change grade without its own numbers changing.
          body: |
            Spire Codex published a newer snapshot, so the bundled rating table
            has been refetched and regraded.

            **Checks: ${{ steps.verify.outcome == 'failure' && 'FAILING — opened as a draft, do not merge without reading the run log' || 'passing' }}**

            Tiers are derived over the whole population, so an entry can move
            grade because *other* entries moved, not only because its own
            numbers changed. The table is also reconciled against Codex's
            compendium, so anything retired from the game is dropped rather
            than left to influence where the band thresholds fall.

            ```
            ${{ steps.fetch.outputs.summary }}
            ```

            Generated by `.github/workflows/refresh-data.yml`.
          add-paths: src/Ossuary/Data/ratings.tsv

      # Merge when this job's own verification passed.
      #
      # GitHub's native auto-merge waits for *required* status checks, and this
      # repository has none that apply here: a pull request opened with
      # GITHUB_TOKEN never triggers ci.yml, so gating on branch protection would
      # leave every refresh waiting forever for a check that cannot arrive. The
      # verification step above runs the same suite CI would, so it is the check
      # being passed.
      #
      # A failing refresh is left as a draft for a human instead. The pull
      # request stays on the record either way, so what changed tier is
      # reviewable after the fact and a bad refresh can be reverted.
      - name: Merge it if the checks passed
        if: steps.pr.outputs.pull-request-number && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          echo "verification passed; merging #$PR"
          # --auto defers to required checks where they exist; without any it
          # merges straight away. Fall back to a plain merge if auto-merge is
          # refused because there is nothing to wait for.
          gh pr merge "$PR" --squash --auto --delete-branch \
            || gh pr merge "$PR" --squash --delete-branch
