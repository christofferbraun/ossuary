name: Harvest draft lifts

# Rebuilds the pairwise lift table behind v2M0's deck-conditioned advice.
#
# Never on a schedule. This is one request per card and relic against a single
# Codex endpoint, so it is the heaviest thing Ossuary asks of them; it is run
# when the model is stale, by a person who meant to.
#
# Runs in two modes so the expensive one is never the first thing tried:
#
#   probe    one request. Prints the raw response so the shape can be
#            confirmed. Start here whenever Codex may have changed.
#   harvest  the full run, resumable across attempts via the checkpoint cache.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (1 request) or harvest (one per card and relic)'
        type: choice
        options: [probe, harvest]
        default: probe
      tier:
        description: 'Rate-limit tier to pace to. Blank uses registered when a key is set.'
        type: string
        default: ''
      fresh:
        description: 'Discard the checkpoint and start the harvest from scratch'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two harvests at once would race on the checkpoint cache and, worse, would
  # halve the rate budget each thinks it has.
  group: harvest-lifts
  cancel-in-progress: false

jobs:
  harvest:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest

    # The harvest paces itself against a published rate limit, so it is slow by
    # design. Generous enough that a run is never cut off mid-table; the
    # checkpoint means even that would only cost the rows in flight.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Survives a cancelled or failed attempt. The harvest appends a row to
      # done.txt only after the pairs from that row are on disk, so restoring a
      # checkpoint can cost a repeated request but never a missing row.
      - name: Restore the checkpoint
        if: inputs.mode == 'harvest' && !inputs.fresh
        uses: actions/cache/restore@v4
        with:
          path: build/harvest
          key: harvest-lifts-${{ github.run_id }}
          restore-keys: harvest-lifts-

      - name: Probe one row
        if: inputs.mode == 'probe'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: >-
          dotnet run --project tools/FetchCodexData/FetchCodexData.csproj -c Release --
          --probe-lifts ${{ inputs.tier && format('--tier {0}', inputs.tier) || '' }}

      - name: Harvest
        if: inputs.mode == 'harvest'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: >-
          dotnet run --project tools/FetchCodexData/FetchCodexData.csproj -c Release --
          --harvest-lifts ${{ inputs.tier && format('--tier {0}', inputs.tier) || '' }}

      # Saved even when the harvest failed, which is the entire point: the next
      # attempt resumes from here rather than starting over.
      - name: Save the checkpoint
        if: always() && inputs.mode == 'harvest'
        uses: actions/cache/save@v4
        with:
          path: build/harvest
          key: harvest-lifts-${{ github.run_id }}

      - name: Open a pull request
        if: inputs.mode == 'harvest' && success()
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: data/lift-harvest
          title: Refresh the draft lift table
          commit-message: |
            Refresh the draft lift table

            Harvested by tools/FetchCodexData --harvest-lifts from
            GET /api/draft-recs/{item_type}/{item_id}.
          body: |
            Rebuilt the pairwise lift table behind deck-conditioned advice.

            Each row is one held card or relic and one candidate, with the
            factor Codex reports for that pair. Pairs below the sample floor
            and pairs that do not move a score are dropped, so the file is
            sparse by construction — most pairs genuinely do not interact.

            Worth checking before merging:

            - the pair count is in the same order as last time. A collapse to
              near zero means Codex's build job had not run, which they report
              as an empty `recommends` rather than as an error.
            - the header comment records the endpoint and the sample floor the
              table was built with.

            Generated by `.github/workflows/harvest-lifts.yml`.
          add-paths: src/Ossuary/Data/lifts.tsv

      - name: Say what happened
        if: always()
        run: |
          echo "### Harvest: ${{ inputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f src/Ossuary/Data/lifts.tsv ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -6 src/Ossuary/Data/lifts.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
            echo "Opened #${{ steps.pr.outputs.pull-request-number }}" >> "$GITHUB_STEP_SUMMARY"
          fi
